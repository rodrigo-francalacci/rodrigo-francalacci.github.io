<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculators — Rodrigo Francalacci</title>
<link rel="stylesheet" href="../shared/vb6-theme.css">
<style>
  /* Calculators list in the VB6 house style. The list comes from /calculators.json. */
  html, body { height: auto; overflow: auto; }
  body { background: var(--face); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
  .cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .card { display: block; color: var(--text); text-decoration: none; background: var(--face); border: 1px solid; border-color: var(--hilite) var(--dkshadow) var(--dkshadow) var(--hilite); box-shadow: inset -1px -1px var(--shadow); }
  a.card:hover { background: var(--light); }
  .card .body { padding: 10px 12px; }
  .card:focus-visible { outline: 1px dotted var(--text); outline-offset: 2px; }
  .card h2 { font-size: 13px; margin: 0 0 4px; }
  .card p { margin: 0 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="win">
    <div class="titlebar"><span class="tt">Calculators</span></div>
    <div class="body" style="padding:12px">
      <p><a href="../">← Home</a></p>
      <div class="cards" id="list"><p class="hint">Loading…</p></div>
    </div>
  </div>
</div>
<script>
(function () {
  var box = document.getElementById("list");
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  fetch("../calculators.json").then(function (r) { return r.json(); }).then(function (list) {
    box.innerHTML = list.map(function (c) {
      var live = c.status === "live";
      return (live ? '<a class="card frame" href="' + esc(c.path) + '">' : '<div class="card frame" aria-disabled="true">') +
        '<div class="body"><h2>' + esc(c.name) + '</h2><p>' + esc(c.description) + '</p><span class="stat ' + (live ? "pass" : "round") + '">' + esc(c.status) + "</span>" +
        (c.updated ? ' <span class="hint">updated ' + esc(c.updated) + "</span>" : "") + "</div>" + (live ? "</a>" : "</div>");
    }).join("");
  }).catch(function () {
    box.innerHTML = '<p class="msg">The list couldn’t be loaded. Open this page from the website (it reads calculators.json), not as a file.</p>';
  });
})();
</script>
</body>
</html>
